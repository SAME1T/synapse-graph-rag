<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapse — Local GraphRAG Engine</title>
  <style>
    :root {
      --bg: #12141c;
      --bg-panel: #181b26;
      --bg-input: #1f2330;
      --border: #2a2f3f;
      --text: #e8e6e1;
      --text-dim: #8b8fa3;
      --accent-vector: #5eead4;
      --accent-graph: #8b7fd1;
      --good: #5eead4;
      --warn: #f5c977;
      --bad: #f28b82;
      --radius: 10px;
      --ms-blue: #0078D4;
      --ms-blue-glow: rgba(0, 120, 212, 0.12);
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--accent-vector);
      outline-offset: 2px;
    }

    /* ---------- Sidebar ---------- */
    aside {
      width: 300px;
      min-width: 300px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
      overflow-y: auto;
    }

    .brand {
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .brand strong {
      color: var(--text);
      font-size: 16px;
      letter-spacing: 0;
      display: block;
      margin-bottom: 2px;
    }

    .panel-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin: 0 0 10px 0;
    }

    .stats-row {
      display: flex;
      gap: 10px;
    }

    .stat-box {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      text-align: center;
    }

    .stat-num {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 600;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .upload-zone {
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .upload-zone:hover {
      border-color: var(--accent-vector);
    }

    .upload-zone input {
      display: none;
    }

    .upload-zone span {
      font-size: 13px;
      color: var(--text-dim);
    }

    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .doc-item {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 13px;
    }

    .doc-item .doc-name {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .doc-name span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .doc-meta {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
      font-family: var(--mono);
    }

    .badge {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 20px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .badge-completed {
      background: rgba(94, 234, 212, 0.15);
      color: var(--good);
    }

    .badge-processing {
      background: rgba(245, 201, 119, 0.15);
      color: var(--warn);
    }

    .badge-failed {
      background: rgba(242, 139, 130, 0.15);
      color: var(--bad);
    }

    /* ---------- Main / Chat ---------- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 28px 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .msg-row {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
    }

    .msg-row.user .bubble {
      background: var(--bg-input);
      margin-left: auto;
      max-width: 80%;
    }

    .msg-row.assistant .bubble {
      background: transparent;
    }

    .bubble {
      border-radius: var(--radius);
      padding: 4px 2px;
      line-height: 1.55;
      font-size: 14.5px;
    }

    .msg-row.user .bubble {
      padding: 10px 14px;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 24px;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }

    .quick-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 12.5px;
      padding: 7px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .quick-btn:hover {
      border-color: var(--accent-vector);
      color: var(--text);
    }

    /* İnce, tema ile uyumlu scrollbar */
    .chat-scroll::-webkit-scrollbar,
    aside::-webkit-scrollbar {
      width: 8px;
    }

    .chat-scroll::-webkit-scrollbar-thumb,
    aside::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 8px;
    }

    .chat-scroll::-webkit-scrollbar-thumb:hover,
    aside::-webkit-scrollbar-thumb:hover {
      background: var(--accent-vector);
    }

    /* Mesaj giriş animasyonu */
    .msg-row {
      animation: msgIn 0.25s ease both;
    }

    @keyframes msgIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Rol etiketleri */
    .role-label {
      font-family: var(--mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    /* Boş durum ikonu */
    .empty-state svg {
      display: block;
      margin: 0 auto 16px;
      opacity: 0.5;
    }

    /* Doküman kartlarına hover derinliği */
    .doc-item {
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .doc-item:hover {
      border-color: var(--accent-vector);
    }

    .groundedness {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
    }

    .gbar {
      width: 90px;
      height: 5px;
      background: var(--bg-input);
      border-radius: 3px;
      overflow: hidden;
    }

    .gbar-fill {
      height: 100%;
      border-radius: 3px;
    }

    .no-llm-badge {
      font-family: var(--mono);
      font-size: 10.5px;
      padding: 3px 8px;
      border-radius: 5px;
      background: rgba(139, 143, 163, 0.15);
      color: var(--text-dim);
    }

    details.evidence {
      margin-top: 10px;
    }

    details.evidence summary {
      cursor: pointer;
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--mono);
      list-style: none;
      user-select: none;
    }

    details.evidence summary::-webkit-details-marker {
      display: none;
    }

    details.evidence summary::before {
      content: "▸ ";
    }

    details.evidence[open] summary::before {
      content: "▾ ";
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-family: var(--mono);
      padding: 5px 10px;
      border-radius: 8px;
      margin: 5px 5px 0 0;
      border: 1px solid var(--border);
    }

    .chip.vector {
      border-left: 3px solid var(--accent-vector);
    }

    .chip.graph {
      border-left: 3px solid var(--accent-graph);
    }

    .chip .score {
      color: var(--text-dim);
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 6px 2px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: blink 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {

      0%,
      80%,
      100% {
        opacity: 0.25;
      }

      40% {
        opacity: 1;
      }
    }

    form.composer {
      border-top: 1px solid var(--border);
      padding: 16px 24px 20px;
      display: flex;
      justify-content: center;
    }

    .composer-inner {
      max-width: 720px;
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .composer-inner textarea {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      padding: 12px 14px;
      resize: none;
      height: 46px;
    }

    .composer-inner button {
      background: var(--accent-vector);
      border: none;
      color: #0b1210;
      font-weight: 600;
      font-size: 14px;
      padding: 0 20px;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .composer-inner button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      padding: 60px 24px;
    }

    .doc-name {
      position: relative;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: var(--bad);
      background: rgba(242, 139, 130, 0.1);
    }

    @media (max-width: 760px) {
      body {
        flex-direction: column;
      }

      aside {
        width: 100%;
        min-width: 0;
        max-height: 40vh;
      }
    }

    .brand-header {
      position: relative;
      padding-bottom: 16px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .brand-header::before {
      content: "";
      position: absolute;
      top: -20px; left: -20px; right: -20px; height: 90px;
      background: radial-gradient(ellipse at top left, var(--ms-blue-glow), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .brand-header > * { position: relative; z-index: 1; }

    .powered-by-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 5px 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-dim);
    }
    .powered-by-badge svg { flex-shrink: 0; }
    .powered-by-badge strong { color: var(--ms-blue); font-weight: 600; }

    .stat-box {
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .stat-box:hover {
      border-color: var(--ms-blue);
      transform: translateY(-1px);
    }
  </style>
</head>

<body>

  <aside>
    <div class="brand-header">
      <div class="brand"><strong>Synapse</strong>Local GraphRAG Engine</div>
      <div class="powered-by-badge">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <rect x="0" y="0" width="5" height="5" fill="#0078D4"/>
          <rect x="7" y="0" width="5" height="5" fill="#5eead4"/>
          <rect x="0" y="7" width="5" height="5" fill="#8b7fd1"/>
          <rect x="7" y="7" width="5" height="5" fill="#0078D4"/>
        </svg>
        <span>Powered by <strong>Microsoft Foundry Local</strong></span>
      </div>
    </div>

    <div>
      <p class="panel-title">Graf İstatistikleri</p>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-num" id="entityCount">–</div>
          <div class="stat-label">Varlık</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="relCount">–</div>
          <div class="stat-label">İlişki</div>
        </div>
      </div>
    </div>

    <div>
      <p class="panel-title">Doküman Yükle</p>
      <label class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".txt,.pdf">
        <span id="uploadLabel">.txt veya .pdf seç</span>
      </label>
    </div>

    <div style="flex:1; min-height:0; display:flex; flex-direction:column;">
      <p class="panel-title">Dokümanlar</p>
      <div class="doc-list" id="docList" style="overflow-y:auto;"></div>
    </div>
  </aside>

  <main>
    <div class="chat-scroll" id="chatScroll">
      <div class="empty-state" id="emptyState">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <circle cx="10" cy="12" r="3" fill="#5eead4" />
          <circle cx="38" cy="10" r="3" fill="#8b7fd1" />
          <circle cx="24" cy="36" r="3" fill="#5eead4" />
          <line x1="10" y1="12" x2="24" y2="36" stroke="#2a2f3f" stroke-width="1.5" />
          <line x1="38" y1="10" x2="24" y2="36" stroke="#2a2f3f" stroke-width="1.5" />
          <line x1="10" y1="12" x2="38" y2="10" stroke="#2a2f3f" stroke-width="1.5" />
        </svg>
        Bir doküman yükle, sonra hakkında soru sor.<br>Sistem sadece kaynaklardaki bilgiyi kullanır — emin olmadığında
        uydurmaz.
      </div>
    </div>

    <form class="composer" id="composerForm">
      <div class="composer-inner">
        <textarea id="queryInput" placeholder="Bir soru sor..." rows="1"></textarea>
        <button type="submit" id="sendBtn">Sor</button>
      </div>
    </form>
  </main>

  <script>
    const API = "/api/v1";

    const chatScroll = document.getElementById("chatScroll");
    const emptyState = document.getElementById("emptyState");

    const composerForm = document.getElementById("composerForm");
    const queryInput = document.getElementById("queryInput");
    const sendBtn = document.getElementById("sendBtn");
    const docList = document.getElementById("docList");
    const fileInput = document.getElementById("fileInput");
    const uploadLabel = document.getElementById("uploadLabel");

    function scrollToBottom() {
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function addUserMessage(text) {
      emptyState.style.display = "none";
      const row = document.createElement("div");
      row.className = "msg-row user";
      row.innerHTML = `<div class="bubble"><div class="role-label" style="text-align:right;">Sen</div></div>`;
      const textNode = document.createElement("div");
      textNode.textContent = text;
      row.querySelector(".bubble").appendChild(textNode);
      chatScroll.appendChild(row);
      scrollToBottom();
    }

    function addTypingIndicator() {
      const row = document.createElement("div");
      row.className = "msg-row assistant";
      row.id = "typingRow";
      row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
      chatScroll.appendChild(row);
      scrollToBottom();
      return row;
    }

    function groundednessColor(score) {
      if (score >= 0.4) return "var(--good)";
      if (score >= 0.15) return "var(--warn)";
      return "var(--bad)";
    }

    function renderAssistantMessage(data) {
      const row = document.createElement("div");
      row.className = "msg-row assistant";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const label = document.createElement("div");
      label.className = "role-label";
      label.textContent = "Synapse";
      bubble.appendChild(label);

      const answerP = document.createElement("div");
      answerP.textContent = data.answer;
      bubble.appendChild(answerP);

      if (data.is_fallback) {
        const badge = document.createElement("div");
        badge.className = "no-llm-badge";
        badge.style.marginTop = "10px";
        badge.textContent = "Kaynak bulunamadı — model çağrılmadı";
        bubble.appendChild(badge);
      } else {
        const gRow = document.createElement("div");
        gRow.className = "groundedness";
        const pct = Math.round(data.groundedness_score * 100);
        gRow.innerHTML = `
      <span>groundedness</span>
      <div class="gbar"><div class="gbar-fill" style="width:${pct}%; background:${groundednessColor(data.groundedness_score)}"></div></div>
      <span>${pct}%</span>
    `;
        bubble.appendChild(gRow);
      }

      if (data.sources && data.sources.length > 0) {
        const det = document.createElement("details");
        det.className = "evidence";
        const chips = data.sources.map(s =>
          `<span class="chip vector">${s.filename} <span class="score">${s.rerank_score.toFixed(2)}</span></span>`
        ).join("");
        det.innerHTML = `<summary>Kaynaklar (${data.sources.length})</summary><div>${chips}</div>`;
        bubble.appendChild(det);
      }

      if (data.graph_facts_used && data.graph_facts_used.length > 0) {
        const det = document.createElement("details");
        det.className = "evidence";
        const chips = data.graph_facts_used.map(f =>
          `<span class="chip graph">${f.subject} → ${f.predicate} → ${f.object}</span>`
        ).join("");
        det.innerHTML = `<summary>Graf ilişkileri (${data.graph_facts_used.length})</summary><div>${chips}</div>`;
        bubble.appendChild(det);
      }

      row.appendChild(bubble);
      chatScroll.appendChild(row);
      scrollToBottom();
    }

    async function askQuestion(question) {
      addUserMessage(question);

      sendBtn.disabled = true;
      const typingRow = addTypingIndicator();

      try {
        const res = await fetch(`${API}/query/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: question })
        });
        const data = await res.json();
        typingRow.remove();
        renderAssistantMessage(data);
      } catch (err) {
        typingRow.remove();
        const row = document.createElement("div");
        row.className = "msg-row assistant";
        row.innerHTML = `<div class="bubble">Bağlantı hatası: sunucuya ulaşılamadı.</div>`;
        chatScroll.appendChild(row);
      } finally {
        sendBtn.disabled = false;
      }
    }

    composerForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = queryInput.value.trim();
      if (!q) return;
      queryInput.value = "";
      askQuestion(q);
    });



    queryInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        composerForm.requestSubmit();
      }
    });

    /* ---------- Doküman listesi + graf istatistikleri ---------- */

    function statusBadge(status) {
      const map = { completed: "Tamamlandı", processing: "İşleniyor", pending: "Bekliyor", failed: "Başarısız" };
      return `<span class="badge badge-${status}">${map[status] || status}</span>`;
    }

    async function refreshDocuments() {
      try {
        const res = await fetch(`${API}/documents/`);
        const data = await res.json();
        docList.innerHTML = "";

        if (data.documents.length === 0) {
          docList.innerHTML = `<div style="color:var(--text-dim); font-size:12px;">Henüz doküman yok.</div>`;
        }

        data.documents.forEach(doc => {
          const item = document.createElement("div");
          item.className = "doc-item";
          item.innerHTML = `
        <div class="doc-name">
          <span>${doc.filename}</span>
          <div style="display:flex; align-items:center; gap:6px;">
            ${statusBadge(doc.status)}
            <button class="delete-btn" data-id="${doc.id}" title="Dok\u00fcman\u0131 sil">\u2715</button>
          </div>
        </div>
        <div class="doc-meta">${doc.chunk_count} chunk${doc.error_message ? " \u00b7 " + doc.error_message.slice(0, 40) : ""}</div>
      `;
          docList.appendChild(item);
          item.querySelector(".delete-btn").addEventListener("click", async (e) => {
            e.stopPropagation();
            if (!confirm(`"${doc.filename}" silinsin mi? Bu i\u015flem geri al\u0131namaz.`)) return;
            try {
              await fetch(`${API}/documents/${doc.id}`, { method: "DELETE" });
              refreshDocuments();
              refreshGraphStats();
            } catch (err) {
              alert("Silme i\u015flemi ba\u015far\u0131s\u0131z oldu.");
            }
          });
        });

        const stillProcessing = data.documents.some(d => d.status === "pending" || d.status === "processing");
        if (stillProcessing) setTimeout(refreshDocuments, 3000);
      } catch (err) {
        console.error("Doküman listesi alınamadı", err);
      }
    }

    async function refreshGraphStats() {
      try {
        const res = await fetch(`${API}/graph/stats`);
        const data = await res.json();
        document.getElementById("entityCount").textContent = data.entity_count;
        document.getElementById("relCount").textContent = data.relationship_count;
      } catch (err) {
        console.error("Graf istatistikleri alınamadı", err);
      }
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      uploadLabel.textContent = `Yükleniyor: ${file.name}`;
      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch(`${API}/documents/upload`, { method: "POST", body: formData });
        if (!res.ok) throw new Error("Yükleme başarısız");
        uploadLabel.textContent = ".txt veya .pdf seç";
        fileInput.value = "";
        refreshDocuments();
        setTimeout(refreshGraphStats, 5000);
        setTimeout(refreshGraphStats, 15000);
      } catch (err) {
        uploadLabel.textContent = "Yükleme başarısız — tekrar dene";
      }
    });

    refreshDocuments();
    refreshGraphStats();
  </script>
